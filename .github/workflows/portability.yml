name: Validate STD native API portability

run-name: Validate STD native API (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target to execute
        required: true
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x64
          - linux-arm64
          - linux-x64
          - windows-arm64
          - windows-x64

permissions:
  contents: read

concurrency:
  group: std-portability-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

env:
  SILEX_CHECKPOINT: cdce4e89f70c6bc18f74f3daf53680002550faf8

jobs:
  macos-arm64:
    if: inputs.target == 'all' || inputs.target == 'macos-arm64'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out STD
        uses: actions/checkout@v6
        with:
          path: STD

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Install Zig 0.16.0 for macOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz -o "$archive"
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  $archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Build Silex and exercise STD on macOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/silex-prefix" \
            --build-file _silex/Toolchain/build.zig
          STD/Tools/verify-boundary-checksums.sh
          STD/Tools/run-portability-smoke.sh \
            "$RUNNER_TEMP/silex-prefix/bin/silex" macos-arm64 "$RUNNER_TEMP/std-smoke"

      - name: Diagnose a failed macOS ARM64 consumer
        if: failure()
        shell: bash
        run: |
          executable="$RUNNER_TEMP/std-smoke/std-portability"
          if [ ! -x "$executable" ]; then
            echo "The consumer executable was not produced."
            exit 0
          fi
          file "$executable"
          lldb --batch \
            -o run \
            -o "thread backtrace all" \
            -- "$executable"

      - name: Preserve the failed macOS ARM64 consumer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: std-macos-arm64-failed-consumer
          path: ${{ runner.temp }}/std-smoke/std-portability
          retention-days: 1
          if-no-files-found: ignore

  macos-x64:
    if: inputs.target == 'all' || inputs.target == 'macos-x64'
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out STD
        uses: actions/checkout@v6
        with:
          path: STD

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Install Zig 0.16.0 for macOS X64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-macos-0.16.0.tar.xz -o "$archive"
          echo "0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7  $archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Build Silex and exercise STD on macOS X64
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/silex-prefix" \
            --build-file _silex/Toolchain/build.zig
          STD/Tools/verify-boundary-checksums.sh
          STD/Tools/run-portability-smoke.sh \
            "$RUNNER_TEMP/silex-prefix/bin/silex" macos-x64 "$RUNNER_TEMP/std-smoke"

  linux-arm64:
    if: inputs.target == 'all' || inputs.target == 'linux-arm64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35

    steps:
      - name: Check out STD
        uses: actions/checkout@v6
        with:
          path: STD

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Install Zig 0.16.0 for Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "expected a native ARM64 runner, got $(uname -m)" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz -o "$archive"
          echo "ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build Silex and exercise STD on Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/silex-prefix" \
            --build-file _silex/Toolchain/build.zig
          STD/Tools/verify-boundary-checksums.sh
          STD/Tools/run-portability-smoke.sh \
            "$RUNNER_TEMP/silex-prefix/bin/silex" linux-arm64 "$RUNNER_TEMP/std-smoke"

  linux-x64:
    if: inputs.target == 'all' || inputs.target == 'linux-x64'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out STD
        uses: actions/checkout@v6
        with:
          path: STD

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Install Zig 0.16.0 for Linux X64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build Silex and exercise STD on Linux X64
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/silex-prefix" \
            --build-file _silex/Toolchain/build.zig
          STD/Tools/verify-boundary-checksums.sh
          STD/Tools/run-portability-smoke.sh \
            "$RUNNER_TEMP/silex-prefix/bin/silex" linux-x64 "$RUNNER_TEMP/std-smoke"

  windows-x64:
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out STD
        uses: actions/checkout@v6
        with:
          path: STD

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Install Zig 0.16.0 for Windows X64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "Zig archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0")

      - name: Build Silex for Windows X64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          zig build -Doptimize=ReleaseFast -Dcpu=baseline `
            --prefix "$env:RUNNER_TEMP/silex-prefix" `
            --build-file _silex/Toolchain/build.zig

      - name: Exercise STD on Windows X64
        shell: bash
        run: |
          set -euo pipefail
          STD/Tools/verify-boundary-checksums.sh
          STD/Tools/run-portability-smoke.sh \
            "$RUNNER_TEMP/silex-prefix/bin/silex.exe" windows-x64 "$RUNNER_TEMP/std-smoke"

  windows-arm64-build:
    if: inputs.target == 'all' || inputs.target == 'windows-arm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out STD
        uses: actions/checkout@v6
        with:
          path: STD

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Cross-build the Windows ARM64 compiler
        shell: bash
        run: |
          set -euo pipefail
          zig build -Dtarget=aarch64-windows -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/silex-prefix" \
            --build-file _silex/Toolchain/build.zig
          zig test STD/Boundary/Source/TerminalSession.zig \
            -O ReleaseSmall \
            -target aarch64-windows \
            --test-no-exec \
            -femit-bin="$RUNNER_TEMP/silex-prefix/bin/terminal-session-test.exe"

      - name: Transfer the Windows ARM64 compiler
        uses: actions/upload-artifact@v4
        with:
          name: std-windows-arm64-silex
          path: ${{ runner.temp }}/silex-prefix
          retention-days: 1
          if-no-files-found: error

  windows-arm64:
    if: inputs.target == 'all' || inputs.target == 'windows-arm64'
    needs: windows-arm64-build
    runs-on: windows-11-arm
    timeout-minutes: 35

    steps:
      - name: Check out STD
        uses: actions/checkout@v6
        with:
          path: STD

      - name: Download the Windows ARM64 compiler
        uses: actions/download-artifact@v5
        with:
          name: std-windows-arm64-silex
          path: ${{ runner.temp }}/silex-prefix

      - name: Verify the native Windows ARM64 compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64" -or $architecture -ne "Arm64") {
            throw "expected a native Windows ARM64 runner"
          }
          $silex = Join-Path $env:RUNNER_TEMP "silex-prefix/bin/silex.exe"
          $bytes = [System.IO.File]::ReadAllBytes($silex)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xaa64) {
            throw "expected an ARM64 Silex executable"
          }

      - name: Exercise the native Windows ARM64 terminal boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:RUNNER_TEMP/silex-prefix/bin/terminal-session-test.exe"

      - name: Exercise STD on Windows ARM64
        shell: bash
        env:
          SILEX_PORTABILITY_TEST_SOURCE: Subprocess.sx
        run: |
          set -euo pipefail
          STD/Tools/verify-boundary-checksums.sh
          STD/Tools/run-portability-smoke.sh \
            "$RUNNER_TEMP/silex-prefix/bin/silex.exe" windows-arm64 "$RUNNER_TEMP/std-smoke"
