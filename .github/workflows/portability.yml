name: Validate STD native API portability

run-name: Validate STD native API (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target to execute
        required: true
        type: choice
        default: all
        options:
          - all
          - linux-x64
          - windows-x64

permissions:
  contents: read

concurrency:
  group: std-portability-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

env:
  SILEX_CHECKPOINT: e3d08900398f85e2552825a9c60f5e85a7f1e459

jobs:
  linux-x64:
    if: inputs.target == 'all' || inputs.target == 'linux-x64'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out STD
        uses: actions/checkout@v6
        with:
          path: STD

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Exercise the changed native STD APIs on Linux X64
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/silex-prefix" \
            --build-file _silex/Toolchain/build.zig
          silex="$RUNNER_TEMP/silex-prefix/bin/silex"
          "$silex" setup
          "$silex" link "$GITHUB_WORKSPACE/STD"
          "$silex" test "$GITHUB_WORKSPACE/STD/Tests/CryptoPrimitives.sx" --nocache
          "$silex" test "$GITHUB_WORKSPACE/STD/Tests/Threading.sx" --nocache
          "$silex" test "$GITHUB_WORKSPACE/STD/Tests/Subprocess.sx" --nocache

  windows-x64:
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out STD
        uses: actions/checkout@v6
        with:
          path: STD

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: ${{ env.SILEX_CHECKPOINT }}
          path: _silex

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "Zig archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0")

      - name: Exercise the changed native STD APIs on Windows X64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          zig build -Doptimize=ReleaseFast -Dcpu=baseline `
            --prefix "$env:RUNNER_TEMP/silex-prefix" `
            --build-file _silex/Toolchain/build.zig
          $silex = Join-Path $env:RUNNER_TEMP "silex-prefix/bin/silex.exe"
          & $silex setup
          & $silex link (Join-Path $env:GITHUB_WORKSPACE "STD")
          & $silex test (Join-Path $env:GITHUB_WORKSPACE "STD/Tests/CryptoPrimitives.sx") --nocache
          & $silex test (Join-Path $env:GITHUB_WORKSPACE "STD/Tests/Threading.sx") --nocache
          & $silex test (Join-Path $env:GITHUB_WORKSPACE "STD/Tests/Process.sx") --nocache
          & $silex test (Join-Path $env:GITHUB_WORKSPACE "STD/Tests/Subprocess.sx") --nocache
