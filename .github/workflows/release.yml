name: Release Silex package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing package tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15

    steps:
      - name: Check out the tagged package
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify package identity and tag
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(python3 -c 'import json; print(json.load(open("Package.json"))["name"])')
          package_version=$(python3 -c 'import json; print(json.load(open("Package.json"))["version"])')
          required_silex=$(python3 -c 'import json; print(json.load(open("Package.json"))["requires"]["silex"])')
          tag_version=${RELEASE_TAG#v}
          test -n "$package_name"
          test -n "$required_silex"
          test "$package_version" = "$tag_version"
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Assemble the source archive
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$PACKAGE_NAME-$PACKAGE_VERSION.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="$PACKAGE_NAME-$PACKAGE_VERSION/" \
            --output="$archive" \
            HEAD
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$PACKAGE_NAME-$PACKAGE_VERSION.tar.gz"
          gh release create "$RELEASE_TAG" \
            "$archive" \
            "$archive.sha256" \
            --verify-tag \
            --title "$PACKAGE_NAME $PACKAGE_VERSION" \
            --generate-notes
